# =============================================================================
# Config 2 — Variante
# H3: center-Modus, max_resolution=10 (grob, ~15 km² pro Zelle)
# Kontext: gleiche Admin-Hierarchie wie config1
# Vergleichsdimension: groebere raeumliche Granularitaet + konservativere Zellzuordnung
# =============================================================================

gazetteer: swissnames3d
source_crs: 2056

target_cells: 100
min_resolution: 5
max_resolution: 10
containment_mode: center

static_slots:
  - objektart: Gemeindegebiet
    label: Gemeinde
    slots: 2
  - objektart: Bezirk
    label: Bezirk
    slots: 1
  - objektart: Kanton
    label: Kanton
    slots: 1

sentence_generator:
  assoc_threshold: 0.001
  max_slots: 10
  max_slots_per_category: 5
  max_categories: 10
  max_filler_slots: 0

output_file: config2/spatial_h3.duckdb
