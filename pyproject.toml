[tool.poetry]
name = "experiments"
version = "0.1.0"
description = "Experiment scripts for geoparser-h3-resolver"
authors = ["Sebastian Gmur"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
geoparser-h3-resolver = {git = "https://github.com/segmue/ma-geoparser-h3-resolver.git"}
h3-multi-resolution-index = {git = "https://github.com/segmue/ma-h3-multi-resolution-engine.git"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
