[tool.poetry]
name = "experiments"
version = "0.1.0"
description = "Experiment scripts for geoparser-h3-resolver"
authors = ["Sebastian Gmur"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
geoparser-h3-resolver = {path = "../geoparser-h3-resolver", develop = true}
h3-multi-resolution-index = {path = "../h3-multi-resolution-index", develop = true}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
